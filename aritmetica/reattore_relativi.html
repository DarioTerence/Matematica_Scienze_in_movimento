<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reattore dei numeri</title>
<style>
:root{--bg:#0a0f1a;--panel:#111a2b;--line:#22304a;--txt:#e6ecf5;--sub:#8fa0b8;--acc:#9cc5ff;--warn:#FF8A80;--amber:#ffb454}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% -10%,rgba(106,165,255,.14),transparent 60%),linear-gradient(rgba(143,160,184,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(143,160,184,.05) 1px,transparent 1px),#0a0f1a;background-size:auto,36px 36px,36px 36px;color:var(--txt);font-family:Calibri,"Segoe UI",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
h1{font-family:Cambria,Georgia,serif;color:var(--acc);font-size:clamp(24px,4vw,34px);margin:6px 0 2px}
.lead{color:var(--sub);margin:0 0 12px;font-size:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.tab{font:inherit;font-size:15px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer}
.tab[aria-selected="true"]{outline:3px solid var(--acc);outline-offset:0;background:var(--acc);color:#0a0f1a;font-weight:700}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.col{min-width:0}
.stage{position:relative;container-type:inline-size;background:linear-gradient(#0d1628,#080d18);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.bubble{position:absolute;left:27%;top:3%;width:31%;background:#17233a;border:1px solid #2b3d5e;border-radius:14px;padding:8px 11px;font-size:max(12px,2.3cqw);line-height:1.3;transition:opacity .25s}
.bubble::before{content:"";position:absolute;left:-10px;top:30px;border:10px solid transparent;border-left:0;border-right-color:#2b3d5e}
.bubble.dim{opacity:.2}
.who{display:block;font:italic 700 .9em Cambria,Georgia,serif;color:var(--acc);margin-bottom:2px}
.sub{display:block;color:var(--sub);font-size:.88em;margin-top:5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.panel h2{font-family:Cambria,Georgia,serif;color:var(--acc);font-size:20px;margin:0 0 8px}
.ancora{background:rgba(255,180,84,.12);border-left:4px solid #ffb454;padding:8px 10px;border-radius:0 8px 8px 0;margin:0 0 12px;font-size:15px}
.lab{color:var(--sub);font-size:14px;margin-bottom:4px}
.expr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-family:Cambria,Georgia,serif;font-size:clamp(22px,4.4vw,31px);margin:0 0 12px;padding:10px 12px;background:#0a111f;border:1px solid var(--line);border-radius:12px;min-height:62px}
.expr>span{white-space:nowrap}
.expr .op{color:var(--acc)}
.ans{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#0a111f;border:2px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:10px;min-height:64px}
.ans .eq{color:var(--sub);font-family:Cambria,Georgia,serif;font-size:26px}
.ans .val{font-family:Cambria,Georgia,serif;font-size:38px;font-weight:700;letter-spacing:1px}
.ans .val.empty{color:#3a4d70}
.ans .val.small{font-size:26px;letter-spacing:0}
.ans .val.fv{display:flex;align-items:center;font-size:30px;letter-spacing:0}
.ans.shake{animation:shk .45s;border-color:var(--warn)}
.ans.ok{border-color:#6fd08c}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.key{font:inherit;font-size:24px;min-height:54px;border-radius:14px;border:1px solid var(--line);background:#16233a;color:var(--txt);cursor:pointer;touch-action:manipulation}
.key:hover{border-color:var(--acc)}
.key.fn{color:var(--acc);font-size:21px}
.key.wide{grid-column:1/-1;font-size:18px;min-height:48px;color:var(--acc)}
.keys.off .key{opacity:.4;pointer-events:none}
.go{width:100%;font:inherit;font-size:19px;font-weight:700;min-height:54px;border-radius:999px;border:0;background:var(--acc);color:#0a0f1a;cursor:pointer}
.go:disabled{opacity:.6;cursor:default}
.steps{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.steps[hidden]{display:none}
.steps .line{font-family:Cambria,Georgia,serif;font-size:clamp(19px,3.4vw,25px);padding:5px 0;white-space:nowrap;overflow-x:auto;overflow-y:hidden}
.steps .snote{color:var(--sub);font-size:15px;margin-top:6px;border-top:1px solid var(--line);padding-top:8px}
.steps .snote:empty{display:none}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;font-size:.85em}
.fr>.n{border-bottom:2px solid currentColor;padding:0 5px}
.fr>.d{padding:0 5px}
.fr.inp>.n,.fr.inp>.d{min-width:46px;min-height:1.4em;text-align:center;cursor:pointer;border-radius:6px}
.fr.inp>.n{border-radius:6px 6px 0 0}
.fr.inp>.d{border-radius:0 0 6px 6px}
.fr.inp .act,.fr.inp>.act{background:rgba(156,197,255,.2);box-shadow:inset 0 0 0 2px var(--acc)}
.rad{display:inline-flex;align-items:stretch;vertical-align:middle;line-height:1.25}
.rad .ix{font-size:.55em;align-self:flex-start;margin:.1em -.16em 0 0;line-height:1}
.rad .rs{display:block;width:.62em;margin-top:1px;overflow:visible;flex:none}
.rad .rc{border-top:2px solid currentColor;padding:0 4px 0 2px;display:flex;align-items:center}
sup{font-size:.62em;line-height:0}
.scene{--c:#ffb454;--glow:rgba(255,180,84,.55);--spd:2.6s;--ease:steps(20)}
.scene.stable{--c:#9cc5ff;--glow:rgba(156,197,255,.6);--spd:18s;--ease:linear}
.scene.error{--c:#FF8A80;--glow:rgba(255,138,128,.6)}
.ring{transform-box:fill-box;transform-origin:50% 50%;animation:spin var(--spd) var(--ease) infinite}
.ring.r2{animation-direction:reverse}
#core{fill:var(--c);transition:fill .4s}
#halo{fill:var(--glow);transition:fill .4s}
.ringc{stroke:var(--c);transition:stroke .4s}
.scene.unstable #core,.scene.error #core{animation:flick 1.2s infinite}
.scene.stable #halo{animation:glow 3s ease-in-out infinite}
.scene.charging #core{animation:charge .5s ease-in-out infinite alternate}
#shakeG.shake{animation:shk .5s}
#coreText{font:700 34px Cambria,Georgia,serif;fill:#0a0f1a;text-anchor:middle;dominant-baseline:central}
.beam{fill:none;stroke:var(--acc);stroke-width:3;stroke-dasharray:9 9;stroke-linecap:round;opacity:0}
.beam.on{opacity:.95;animation:dash .5s linear infinite}
.spark{fill:#e6ecf5;animation:spark 1.2s ease-out forwards}
#token{transition:transform .7s ease;opacity:0}
#token.nt{transition:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flick{0%,100%{opacity:1}12%{opacity:.55}30%{opacity:.95}41%{opacity:.4}58%{opacity:1}73%{opacity:.7}}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes charge{from{transform:scale(1)}to{transform:scale(1.14)}}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes dash{to{stroke-dashoffset:-18}}
@keyframes spark{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
#core,#halo{transform-box:fill-box;transform-origin:50% 50%}
@media (max-width:760px){
 .grid{grid-template-columns:1fr}
 .bubble{position:static;width:auto;margin:0;border-radius:0;border:0;border-top:1px solid var(--line);font-size:16px;background:#14203a}
 .bubble::before{display:none}
 .stage{display:flex;flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}
</style>
</head>

<script>
(function(){
"use strict";
var MINUS="−",DOT="·";
var $=function(id){return document.getElementById(id)};
var scene=$("scene"),bubble=$("bubble"),beam=$("beam");

/* ---------- utilità di formattazione ---------- */
function sgn(n){return n<0?MINUS:"+"}
function fmt(n,plus){return n<0?MINUS+Math.abs(n):(plus&&n>0?"+":"")+n}
function lead(n){return n<0?MINUS+Math.abs(n):""+n}
function term(n){return "("+sgn(n)+Math.abs(n)+")"}
function paren(n){return n<0?"("+MINUS+Math.abs(n)+")":""+n}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[rnd(0,a.length-1)]}
function rsg(){return Math.random()<0.5?-1:1}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t}return a}
function lcm(a,b){return a/gcd(a,b)*b}
function sup(n){return "<sup>"+(n<0?MINUS+Math.abs(n):n)+"</sup>"}
function frac(n,d){return '<span class="fr"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>'}
function sfrac(p,q){if(p===0)return "0";if(q===1)return fmt(p,true);return (p<0?MINUS:"+")+frac(Math.abs(p),q)}
function lfrac(p,q){if(p===0)return "0";if(q===1)return lead(p);return (p<0?MINUS:"")+frac(Math.abs(p),q)}
function tfrac(p,q){return "("+(p<0?MINUS:"+")+frac(Math.abs(p),q)+")"}
function radh(ix,inner){return '<span class="rad">'+(ix===3?'<span class="ix">3</span>':'')+'<svg class="rs" viewBox="0 0 10 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0.6 12.2 L2.4 11 L5 19 L10 0 L10.9 0" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="miter" stroke-linecap="butt"/></svg><span class="rc"><span>'+inner+'</span></span></span>'}
function reduce(p,q){var g=gcd(p,q)||1;if(q<0){p=-p;q=-q}return {p:p/g,q:q/g}}
function eqv(a,v){return a.p*v.q===v.p*a.q}
function opSpan(c){return '<span class="op">'+c+'</span>'}
function item(h){return "<span>"+h+"</span>"}
/* passaggi: prima riga con "=" finale, righe intermedie con "=" iniziale e finale, ultima con "=" iniziale */
function mkSteps(lines){return lines.map(function(l,i){var s=(i>0?"= ":"")+l;if(i<lines.length-1)s+=" =";return s})}
function lastN(t){return t[t.length-1]}

/* ---------- suggerimenti generici ---------- */
function genericHint(list,tries){return list[Math.min(tries-1,list.length-1)]}
var SIGNMSG="Il valore assoluto è giusto, ma il segno no.";

/* ======================================================
   STAZIONE 1 - somma e sottrazione
   ====================================================== */
var lastKey={};
function fresh(id,key){if(lastKey[id]===key)return false;lastKey[id]=key;return true}
function nz(m){var n=0;while(n===0)n=rnd(-m,m);return n}

function gen1(){
 for(;;){
  var k=Math.random()<0.6?2:3,t=[{op:null,n:nz(14)}],i;
  for(i=1;i<k;i++)t.push({op:Math.random()<0.5?"+":"-",n:nz(14)});
  var s=t[0].n,parts=[s];
  for(i=1;i<k;i++){s+=t[i].op==="+"?t[i].n:-t[i].n;parts.push(s)}
  if(parts.some(function(p){return Math.abs(p)>20}))continue;
  if(!t.some(function(x){return x.n<0}))continue;
  if(!fresh(1,t.map(function(x){return (x.op||"")+x.n}).join("|")))continue;
  var html="",plain="";
  t.forEach(function(x,j){
   if(j>0){html+=opSpan(x.op==="+"?"+":MINUS);plain+=" "+(x.op==="+"?"+":MINUS)+" "}
   html+=item(term(x.n));plain+=term(x.n);
  });
  var eff=t.map(function(x,j){return j===0?x.n:(x.op==="+"?x.n:-x.n)});
  var l2=eff.map(function(e,j){return j===0?lead(e):(e<0?MINUS:"+")+" "+Math.abs(e)}).join(" ");
  var lines=[plain,l2];
  if(k===3){lines.push(lead(parts[1])+" "+(eff[2]<0?MINUS:"+")+" "+Math.abs(eff[2]))}
  lines.push(fmt(s,true));
  return {kind:"int",html:html,value:s,parts:parts,t:t,eff:eff,steps:mkSteps(lines),
   note:"Sottrarre un numero equivale a sommare il suo opposto: i segni delle parentesi si eliminano con la regola dei segni."};
 }
}
function hint1(e,a,tries){
 var v=e.value,allPlus=e.t.reduce(function(s,x){return s+x.n},0);
 var absSum=e.eff.reduce(function(s,x){return s+Math.abs(x)},0);
 var mixed=e.eff.some(function(x){return x>0})&&e.eff.some(function(x){return x<0});
 if(v!==0&&a===-v)return SIGNMSG+" Chiediti quale termine ha il valore assoluto maggiore.";
 if(e.t.some(function(x,i){return i>0&&x.op==="-"})&&a===allPlus&&a!==v)return "Hai trattato la sottrazione come una somma. Sottrarre un numero equivale a sommare il suo opposto.";
 if(mixed&&Math.abs(a)===absSum)return "Hai sommato i valori assoluti. Con segni discordi i valori assoluti si sottraggono.";
 if(a!==v&&Math.sign(a)===Math.sign(v)&&Math.abs(a-v)<=2)return "Il segno è giusto e sei vicino: ricontrolla il conteggio del valore assoluto.";
 return genericHint(["Non ci siamo. Riscrivi ogni sottrazione come somma dell'opposto, poi decidi il segno dal valore assoluto maggiore.",
  "Riparti dal primo passaggio: calcola solo i primi due termini e poi aggiungi il terzo (se c'è).",
  "Immagina la retta: il segno indica il verso dello spostamento, il valore assoluto la sua lunghezza."],tries);
}

/* ======================================================
   STAZIONE 2 - moltiplicazione e divisione
   ====================================================== */
function gen2(){
 for(var g=0;g<2000;g++){
  var k=Math.random()<0.65?2:3,f=[rsg()*rnd(2,12)],ops=[],cur=f[0],ok=true,i;
  for(i=1;i<k;i++){
   var op=Math.random()<0.42?":":DOT,b;
   if(op===":"){
    var ds=[];for(var d=2;d<=Math.min(12,Math.abs(cur));d++)if(Math.abs(cur)%d===0)ds.push(d);
    if(ds.length)b=pick(ds)*rsg();else op=DOT;
   }
   if(op===DOT)b=rnd(2,9)*rsg();
   cur=op===DOT?cur*b:cur/b;
   if(Math.abs(cur)>150){ok=false;break}
   f.push(b);ops.push(op);
  }
  if(!ok)continue;
  var neg=f.filter(function(x){return x<0}).length;
  if(neg===0)continue;
  if(!fresh(2,f.join(",")+ops.join("")))continue;
  var html="",plain="",absx="";
  f.forEach(function(x,j){
   if(j>0){html+=opSpan(ops[j-1]);plain+=" "+ops[j-1]+" ";absx+=" "+ops[j-1]+" "}
   html+=item(term(x));plain+=term(x);absx+=Math.abs(x);
  });
  var sign=neg%2?MINUS:"+";
  return {kind:"int",html:html,value:cur,f:f,ops:ops,neg:neg,
   steps:mkSteps([plain,sign+"("+absx+")",fmt(cur,true)]),
   note:"Fattori negativi: "+neg+(neg%2?" (numero dispari): il risultato è negativo.":" (numero pari): il risultato è positivo.")+" Il valore assoluto si calcola da sinistra a destra."};
 }
}
function hint2(e,a,tries){
 var v=e.value;
 if(a===-v)return SIGNMSG+" Conta i termini negativi: se sono in numero pari il risultato è positivo, se sono dispari è negativo.";
 if(e.f.length===2){
  var x=e.f[0],y=e.f[1];
  if(e.ops[0]===DOT&&a===x+y)return "Hai sommato i due numeri invece di moltiplicarli.";
  if(e.ops[0]===":"&&a===x*y)return "Hai moltiplicato invece di dividere.";
  if(e.ops[0]===":"&&a===x-y)return "Hai sottratto invece di dividere.";
 }
 if(Math.abs(a)===Math.abs(v))return SIGNMSG;
 return genericHint(["Separa i due problemi: prima decidi il segno con la regola dei segni, poi calcola il valore assoluto.",
  "Calcola solo il valore assoluto: ignora i segni e svolgi le operazioni da sinistra a destra.",
  "Regola dei segni: (+)(+)=+, (−)(−)=+, (+)(−)=−. Per le divisioni vale la stessa regola."],tries);
}

/* ======================================================
   STAZIONE 3 - potenze (anche con esponente negativo)
   ====================================================== */
function ipow(b,n){var r=1;for(var i=0;i<n;i++)r*=b;return r}
function pw(b,n){return "("+sgn(b)+Math.abs(b)+")"+sup(n)}
function gen3(){

   if(!fresh(3,"A"+b+n))continue;
   var fs=[];for(var i=0;i<n;i++)fs.push(term(b));
   var v=ipow(b,n);
   o={kind:"int",html:item(pw(b,n)),value:v,type:"A",b:b,n:n,
    steps:mkSteps([pw(b,n),fs.join(" "+DOT+" "),fmt(v,true)]),

  }else if(type==="B"){b=rnd(2,6);n=rnd(2,4);if(ipow(b,n)>400)continue;

   if(!fresh(3,"C"+b+n))continue;

   var v3=ipow(b,n);

   }
  }else if(type==="N"){b=rsg()*rnd(2,5);n=rnd(1,4);if(ipow(Math.abs(b),n)>125)continue;
   if(!fresh(3,"N"+b+n))continue;
   var den=ipow(b,n),P=den<0?-1:1,Q=Math.abs(den);
   o={kind:"frac",html:item(pw(b,-n)),value:{p:P,q:Q},type:"N",b:b,n:n,
    steps:mkSteps([pw(b,-n),frac(1,pw(b,n)),frac(1,paren(den)),sfrac(P,Q)]),
    note:"Esponente negativo: si passa all'inverso della base e l'esponente diventa positivo."};
  }else{
   var b1=rsg()*rnd(2,5),n1=rnd(2,3),b2=rsg()*rnd(2,5),n2=rnd(2,3),op=Math.random()<0.5?"+":"-";
   if(b1>0&&b2>0)continue;

    steps:mkSteps([pw(b1,n1)+" "+sy+" "+pw(b2,n2),term(v1)+" "+sy+" "+term(vv2),lead(v1)+" "+(e2<0?MINUS:"+")+" "+Math.abs(e2),fmt(vt,true)]),

   ====================================================== */
function gen4(){
 for(var g=0;g<2000;g++){
  var r=Math.random(),n,o;
  if(r<0.34){n=rnd(2,15);if(!fresh(4,"S"+n))continue;
   o={kind:"imp",type:"S",n:n,value:n,html:item(radh(2,n*n)),
    steps:mkSteps([radh(2,n*n),radh(2,n+sup(2)),fmt(n,true)]),
    note:"La radice quadrata di un numero è il numero non negativo che, elevato al quadrato, dà il radicando."};
  }else if(r<0.46){n=rnd(2,12);if(!fresh(4,"M"+n))continue;
   o={kind:"imp",type:"M",n:n,value:-n,html:item(MINUS+radh(2,n*n)),
    steps:mkSteps([MINUS+radh(2,n*n),MINUS+radh(2,n+sup(2)),fmt(-n,true)]),
    note:"Il segno meno sta fuori dalla radice: si calcola prima la radice e poi si cambia segno."};
  }else if(r<0.60){n=rnd(2,12);if(!fresh(4,"I"+n))continue;
   o={kind:"imp",type:"I",n:n,value:null,html:item(radh(2,"("+MINUS+n*n+")")),
    steps:mkSteps([radh(2,"("+MINUS+n*n+")"),"impossibile"]),
    note:"Nessun numero relativo, elevato al quadrato, dà un risultato negativo: la radice quadrata di un numero negativo non esiste tra i numeri relativi."};
  }else if(r<0.80){n=rnd(2,6);if(!fresh(4,"C"+n))continue;
   o={kind:"imp",type:"C",n:n,value:-n,html:item(radh(3,"("+MINUS+n*n*n+")")),
    steps:mkSteps([radh(3,"("+MINUS+n*n*n+")"),radh(3,paren(-n)+sup(3)),fmt(-n,true)]),
    note:"Con indice dispari il radicando può essere negativo, e la radice ha lo stesso segno del radicando."};
  }else if(r<0.86){n=rnd(2,6);if(!fresh(4,"P"+n))continue;
   o={kind:"imp",type:"P",n:n,value:n,html:item(radh(3,n*n*n)),
    steps:mkSteps([radh(3,n*n*n),radh(3,n+sup(3)),fmt(n,true)]),
    note:"La radice cubica è l'operazione inversa dell'elevamento al cubo."};
  }else{
   var a=rnd(2,12),b=rnd(2,4),s=rsg(),op=Math.random()<0.5?"+":"-";
   var cub=s*b,e2=op==="+"?cub:-cub,v=a+e2;
   if(!fresh(4,"E"+a+op+cub))continue;
   var sy=op==="+"?"+":MINUS;
   o={kind:"imp",type:"E",value:v,a:a,cub:cub,op:op,
    html:item(radh(2,a*a))+opSpan(sy)+item(radh(3,paren(cub*cub*cub))),
    steps:mkSteps([radh(2,a*a)+" "+sy+" "+radh(3,paren(cub*cub*cub)),
      radh(2,a+sup(2))+" "+sy+" "+radh(3,paren(cub)+sup(3)),
      term(a)+" "+sy+" "+term(cub),
      a+" "+(e2<0?MINUS:"+")+" "+Math.abs(e2),
      fmt(v,true)]),
    note:"Si calcolano prima le radici, poi si esegue la somma o la sottrazione."};
  }
  return o;
 }
}

 }

var DEN=[2,3,4,5,6,8,9,10,12];
function operand(){
 for(;;){var b=pick(DEN),a=rsg()*rnd(1,9);if(a%b!==0&&gcd(a,b)===1)return {p:a,q:b}}
}
function gen5(){
 for(var g=0;g<4000;g++){
  var r=Math.random(),A=operand(),B=operand(),a=A.p,b=A.q,c=B.p,d=B.q,o;
  if(r<0.45){
   var op=Math.random()<0.5?"+":"-";
   if(Math.random()<0.3){d=b;B.q=b;if(gcd(c,d)!==1)continue}
   if(a>0&&c>0&&op==="+")continue;
   if(a>0&&c<0&&op==="-")continue;
   var m=lcm(b,d);if(m>36)continue;
   var e2=op==="+"?c:-c,n1=a*(m/b),n2=e2*(m/d),P=n1+n2,V=reduce(P,m);
   if(Math.abs(V.p)>99||V.q>99)continue;
   if(!fresh(5,"A"+a+"/"+b+op+c+"/"+d))continue;
   var sy=op==="+"?"+":MINUS;
   var L=[tfrac(a,b)+" "+sy+" "+tfrac(c,d),lfrac(a,b)+" "+(e2<0?MINUS:"+")+" "+frac(Math.abs(c),d)];
   var numStr=(n1<0?MINUS:"")+Math.abs(n1)+" "+(n2<0?MINUS:"+")+" "+Math.abs(n2);
   L.push(frac(numStr,m));
   if(P===0){L.push("0")}else if(V.p===P&&V.q===m){L.push(sfrac(P,m))}else{L.push(sfrac(P,m));L.push(sfrac(V.p,V.q))}
   o={kind:"frac",type:"add",html:item(tfrac(a,b))+opSpan(sy)+item(tfrac(c,d)),value:V,a:a,b:b,c:c,d:d,op:op,steps:mkSteps(L),
      note:b===d?"Le frazioni hanno lo stesso denominatore: si sommano i numeratori con il loro segno.":"Denominatore comune: mcm("+b+", "+d+") = "+m+". Ogni numeratore si moltiplica per il fattore che porta il denominatore a "+m+"."};
  }else if(r<0.75){
   if(a>0&&c>0)continue;
   var P2=a*c,Q2=b*d,V2=reduce(P2,Q2);
   if(Math.abs(V2.p)>99||V2.q>60)continue;
   if(!fresh(5,"M"+a+"/"+b+"*"+c+"/"+d))continue;
   var L2=[tfrac(a,b)+" "+DOT+" "+tfrac(c,d),(P2<0?MINUS:"+")+frac(Math.abs(a)+" "+DOT+" "+Math.abs(c),b+" "+DOT+" "+d),sfrac(P2,Q2)];
   if(V2.p!==P2||V2.q!==Q2)L2.push(sfrac(V2.p,V2.q));
   o={kind:"frac",type:"mul",html:item(tfrac(a,b))+opSpan(DOT)+item(tfrac(c,d)),value:V2,a:a,b:b,c:c,d:d,steps:mkSteps(L2),
      note:"Il prodotto di due frazioni ha per numeratore il prodotto dei numeratori e per denominatore il prodotto dei denominatori; il segno segue la regola dei segni."};
  }else{
   if(a>0&&c>0)continue;
   var sc=c<0?-1:1,P3=a*d*sc,Q3=b*Math.abs(c),V3=reduce(P3,Q3);
   if(Math.abs(V3.p)>99||V3.q>60)continue;
   if(!fresh(5,"D"+a+"/"+b+":"+c+"/"+d))continue;
   var L3=[tfrac(a,b)+" : "+tfrac(c,d),tfrac(a,b)+" "+DOT+" "+tfrac(sc*d,Math.abs(c)),
     (P3<0?MINUS:"+")+frac(Math.abs(a)+" "+DOT+" "+d,b+" "+DOT+" "+Math.abs(c)),sfrac(P3,Q3)];
   if(V3.p!==P3||V3.q!==Q3)L3.push(sfrac(V3.p,V3.q));
   o={kind:"frac",type:"div",html:item(tfrac(a,b))+opSpan(":")+item(tfrac(c,d)),value:V3,a:a,b:b,c:c,d:d,steps:mkSteps(L3),
      note:"Dividere per una frazione equivale a moltiplicare per la sua inversa (il segno si conserva)."};
  }
  return o;
 }
}
function hint5(e,a,tries){
 var v=e.value;
 if(a.p!==0&&eqv(a,{p:-v.p,q:v.q}))return SIGNMSG+" Controlla la regola dei segni.";
 if(e.type==="add"){
  var eff=e.op==="+"?e.c:-e.c;
  if(a.q>0&&eqv(a,{p:e.a+eff,q:e.b+e.d}))return "Non si sommano i denominatori. Per addizioni e sottrazioni servono frazioni con lo stesso denominatore: trova il denominatore comune.";
  return genericHint(["Non ci siamo. Trova il denominatore comune (mcm dei denominatori) e riscrivi le due frazioni.",
   "Dopo il denominatore comune si sommano i numeratori, ciascuno con il proprio segno. Il denominatore resta quello comune.",
   "Controlla anche il segno: sottrarre una frazione equivale a sommare la sua opposta."],tries);
 }
 if(e.type==="mul"){
  return genericHint(["Non ci siamo. Prima decidi il segno, poi moltiplica i numeratori tra loro e i denominatori tra loro.",
   "Dopo il prodotto controlla se la frazione si può semplificare: il risultato è corretto anche non semplificato, ma si può ridurre.",
   "Segno: (+)(+)=+, (−)(−)=+, (+)(−)=−."],tries);
 }
 if(a.q>0&&eqv(a,reduce(e.a*e.c,e.b*e.d)))return "Hai moltiplicato le due frazioni. Dividere per una frazione equivale a moltiplicare per la sua inversa: l'hai invertita?";
 return genericHint(["Non ci siamo. Trasforma la divisione in moltiplicazione per la frazione inversa del secondo termine.",
  "Inversa di una frazione: scambia numeratore e denominatore (il segno resta). Poi moltiplica e decidi il segno.",
  "Dopo il prodotto controlla se la frazione si può semplificare."],tries);
}

 if(cur.kind==="frac"){
  v.className="val fv";
  v.innerHTML='<span>'+(A.neg?MINUS:"")+'</span><span class="fr inp"><span class="n'+(A.field==="num"?" act":"")+'" data-f="num">'+(A.num||"&nbsp;")+'</span><span class="d'+(A.field==="den"?" act":"")+'" data-f="den">'+(A.den||"&nbsp;")+'</span></span>';
 }else{
  var txt=A.imp?"impossibile":(A.neg?MINUS:"")+A.num;
  v.className="val"+(txt?"":" empty")+(A.imp?" small":"");
  v.textContent=txt||"?";
 }
}
$("val").addEventListener("click",function(e){
 var t=e.target.closest?e.target.closest("[data-f]"):null;
 if(t&&cur.kind==="frac"&&!busy&&!solved){A.field=t.getAttribute("data-f");renderAns()}
});
function press(c){
 if(busy||solved)return;
 if(c==="neg"){if(A.imp)A.imp=false;A.neg=!A.neg}
 else if(c==="imp"){A.imp=true;A.neg=false;A.num="";A.den=""}
 else if(c==="fld"){if(cur.kind==="frac")A.field=A.field==="num"?"den":"num"}
 else if(c==="del"){
  if(A.imp)A.imp=false;
  else if(cur.kind==="frac"){if(A[A.field])A[A.field]=A[A.field].slice(0,-1);else if(A.field==="den")A.field="num";else A.neg=false}
  else{if(A.num)A.num=A.num.slice(0,-1);else A.neg=false}
 }else{
  if(A.imp)A.imp=false;
  var f=cur.kind==="frac"?A.field:"num",max=f==="den"?3:3;
  if(A[f].length<max&&!(A[f]==="0"&&c==="0"))A[f]=(A[f]==="0"?"":A[f])+c;
 }
 renderAns();
}
function readAnswer(){
 if(cur.kind==="frac"){
  if(!A.num){say("Inserisci almeno il numeratore.");return null}
  var q=A.den?parseInt(A.den,10):1;
  if(q===0){say("Il denominatore non può essere zero.");return null}
  return {p:(A.neg?-1:1)*parseInt(A.num,10),q:q};
 }
 if(A.imp)return "imp";
 if(!A.num){say("Inserisci prima un numero con la tastiera.");return null}
 return (A.neg?-1:1)*parseInt(A.num,10);
}

var NEWMSG=["Nuovo guasto! Calcola il valore che serve al reattore.","Il reattore sbanda di nuovo: serve un altro calcolo.","Altra regolazione: qual è il valore giusto?"];
var OKMSG=["Perfetto! Il reattore si stabilizza.","Esatto! Energia stabile.","Bravissimo: valori in equilibrio."];
function showSteps(p){
 $("stepsLines").innerHTML=p.steps.map(function(l){return '<div class="line">'+l+'</div>'}).join("");
 $("stepsNote").textContent=p.note||"";
 $("stepsBox").hidden=false;
}
function newProblem(){
 timers.forEach(clearTimeout);timers=[];
 cur=STATIONS[si].gen();A=freshAns();
 $("expr").innerHTML=cur.html;
 renderKeys();renderAns();clearLine();$("stepsBox").hidden=true;
 setState("unstable");setCore("?");
 busy=false;solved=false;wrong=0;
 $("go").textContent="Attiva il reattore";$("go").disabled=false;
 $("keys").classList.remove("off");$("ans").classList.remove("ok");
 say(pick(NEWMSG));
}
function setStation(i){
 si=i;
 Array.prototype.forEach.call($("tabs").children,function(b,j){b.setAttribute("aria-selected",j===i?"true":"false")});
 $("stTitle").textContent="Stazione "+(i+1)+" · "+STATIONS[i].name;
 $("ancora").textContent=STATIONS[i].ancora;
 $("line").style.display=STATIONS[i].line?"":"none";
 newProblem();
}
function go(){
 if(busy)return;
 if(solved){newProblem();return}
 var a=readAnswer();if(a===null)return;
 busy=true;
 setPose(1);beam.classList.add("on");scene.classList.add("charging");bubble.classList.add("dim");
 $("go").disabled=true;
 later(function(){
  setPose(0);beam.classList.remove("on");scene.classList.remove("charging");bubble.classList.remove("dim");
  evaluate(a);
 },1100);
}
function check(a){
 if(cur.kind==="frac")return eqv(a,cur.value);
 if(cur.value===null)return a==="imp";
 return a===cur.value;
}
function evaluate(a){
 if(check(a)){
  setState("stable");setCore(coreFor(cur));sparks();
  if(STATIONS[si].line)animateLine(cur);
  showSteps(cur);
  var sub="";
  if(cur.kind==="frac"&&a.q!==1&&gcd(a.p,a.q)>1)sub="Giusto, ma la frazione si può ancora semplificare: la forma ridotta è nei passaggi.";
  say(pick(OKMSG),sub);
  solved=true;busy=false;
  $("ans").classList.add("ok");$("keys").classList.add("off");
  $("go").textContent="Prossimo calcolo";$("go").disabled=false;
 }else{
  wrong++;
  setState("error");setCore("!");
  $("shakeG").classList.remove("shake");void $("shakeG").getBoundingClientRect();$("shakeG").classList.add("shake");
  $("ans").classList.remove("shake");void $("ans").getBoundingClientRect();$("ans").classList.add("shake");
  say(STATIONS[si].hint(cur,a,wrong));
  later(function(){setState("unstable");setCore("?");$("shakeG").classList.remove("shake");$("ans").classList.remove("shake");A=freshAns();renderAns();busy=false;$("go").disabled=false},1300);
 }
}
function sparks(){
 var g=$("sparks");g.innerHTML="";
 for(var i=0;i<14;i++){
  var a=i/14*Math.PI*2,r=90+Math.random()*30,c=document.createElementNS("http://www.w3.org/2000/svg","circle");
  c.setAttribute("r",2+Math.random()*2);c.setAttribute("class","spark");
  c.style.setProperty("--dx",(Math.cos(a)*r)+"px");c.style.setProperty("--dy",(Math.sin(a)*r)+"px");
  g.appendChild(c);
 }
 later(function(){g.innerHTML=""},1400);
}

/* ---------- schede e tastiera ---------- */
STATIONS.forEach(function(s,i){
 var b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");
 b.textContent=s.name;b.setAttribute("aria-selected","false");
 b.addEventListener("click",function(){if(!busy&&i!==si)setStation(i)});
 $("tabs").appendChild(b);
});
$("go").addEventListener("click",go);
document.addEventListener("keydown",function(e){
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(/^[0-9]$/.test(e.key))press(e.key);
 else if(e.key==="-"||e.key==="+")press("neg");
 else if(e.key==="Backspace")press("del");
 else if(e.key==="/"||e.key==="ArrowUp"||e.key==="ArrowDown"){if(cur.kind==="frac"){e.preventDefault();press("fld")}}
 else if(e.key==="Enter"&&!(e.target&&e.target.tagName==="BUTTON"))go();
});

/* ---------- avvio: saluto con la mano ---------- */
setStation(0);
say("Ciao, sono Prof. T! Il reattore è instabile: aiutami a calcolare il valore che lo stabilizza.");
busy=true;
[1,0,1,0].forEach(function(p,i){later(function(){setPose(p)},300+i*450)});
later(function(){setPose(0);busy=false},2300);

window.__t={STATIONS:STATIONS,cur:function(){return cur},setStation:setStation,gens:[gen1,gen2,gen3,gen4,gen5],hints:[hint1,hint2,hint3,hint4,hint5],eqv:eqv,reduce:reduce};
})();
</script>
